    <script>
      async function loadHtmlIncludes() {
        const includeTargets = document.querySelectorAll("[data-include-html]");

        for (const target of includeTargets) {
          const includePath = target.getAttribute("data-include-html");
          const response = await fetch(includePath);

          if (!response.ok) {
            target.outerHTML = "";
            continue;
          }

          let html = await response.text();
          html = html.replaceAll("@@webRoot/", "../../");
          html = html.replaceAll("@@webRoot", "../..");
          target.outerHTML = html;
        }
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Failed to load " + src));
          document.body.appendChild(script);
        });
      }

      async function bootSubmitPage() {
        await loadHtmlIncludes();

        const scripts = [
          "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js",
          "https://cdn.jsdelivr.net/npm/simplebar@6.2.5/dist/simplebar.min.js",
          "../../assets/js/main.js",
          "../../assets/js/vendors/sidebarnav.js",
          "../../assets/js/backoffice-submit.js",
        ];

        for (const scriptPath of scripts) {
          try {
            await loadScript(scriptPath);
          } catch (error) {
            console.error(error);
          }
        }
      }

      bootSubmitPage();
    </script>
    <script>
      // Auto-sélection du devoir quand on vient du feed - Version définitive
      (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const devoirId = urlParams.get("add_correction_for");
        const devoirTitle = urlParams.get("title");

        if (!devoirId) {
          return;
        }

        console.log("🔍 Recherche du devoir ID:", devoirId);

        // Fonction pour forcer la sélection
        function forceSelectDevoir(selectElement, targetId) {
          if (!selectElement) return false;

          let found = false;
          for (let i = 0; i < selectElement.options.length; i++) {
            if (selectElement.options[i].value == targetId) {
              selectElement.selectedIndex = i;
              found = true;
              console.log(
                "✅ Devoir sélectionné:",
                selectElement.options[i].text,
              );

              // CHANGEMENT IMPORTANT : Déclencher l'événement change correctement
              const event = new Event("change", { bubbles: true });
              selectElement.dispatchEvent(event);

              // Aussi pour les frameworks qui écoutent input
              selectElement.dispatchEvent(
                new Event("input", { bubbles: true }),
              );
              break;
            }
          }

          if (!found && selectElement.options.length > 0) {
            console.log(
              "⚠️ ID",
              targetId,
              "non trouvé. IDs disponibles:",
              Array.from(selectElement.options)
                .map((o) => o.value)
                .join(", "),
            );
          }

          return found;
        }

        // Fonction pour ajouter le message visuel
        function addVisualMessage() {
          if (document.querySelector(".prefill-badge")) return;

          const correctionCard = document
            .querySelector("#form-correction")
            ?.closest(".modern-form-container");
          if (correctionCard) {
            const badge = document.createElement("div");
            badge.className = "prefill-badge alert alert-success";
            badge.style.cssText =
              "border-radius:0.75rem;padding:0.75rem 1rem;margin-bottom:1rem;background:#d1fae5;color:#065f46;border:1px solid #10b981;font-weight:500;";
            badge.innerHTML = `
                <i class="fas fa-check-circle"></i> 
                <strong>Correction en cours :</strong> Vous êtes en train de corriger "${decodeURIComponent(devoirTitle || "")}" (ID: ${devoirId})
                <button type="button" class="float-end btn-close-custom" style="float:right;background:none;border:none;cursor:pointer;color:#065f46;font-size:1.2rem;" onclick="this.parentElement.remove()">&times;</button>
            `;
            correctionCard.insertBefore(badge, correctionCard.firstChild);
          }
        }

        // Observer pour surveiller l'arrivée des options
        let attempts = 0;
        const maxAttempts = 20; // 10 secondes max (20 * 500ms)

        const checkInterval = setInterval(() => {
          attempts++;
          const select = document.getElementById("id_devoir");

          if (select && select.options.length > 1) {
            console.log(
              `📋 Tentative ${attempts}: ${select.options.length} options disponibles`,
            );

            const success = forceSelectDevoir(select, devoirId);

            if (success) {
              console.log("🎉 Succès ! Le devoir est sélectionné");
              addVisualMessage();
              clearInterval(checkInterval);
              observer.disconnect();
            }
          } else if (select) {
            console.log(
              `⏳ Tentative ${attempts}: Sélecteur trouvé mais ${select.options.length} options (attente chargement...)`,
            );
          } else {
            console.log(
              `⏳ Tentative ${attempts}: Sélecteur pas encore dans le DOM`,
            );
          }

          if (attempts >= maxAttempts) {
            console.log("❌ Délai dépassé, abandon de la pré-sélection");
            clearInterval(checkInterval);
            observer.disconnect();
          }
        }, 500);

        // MutationObserver pour capturer quand les options sont ajoutées dynamiquement
        const observer = new MutationObserver(function (mutations) {
          const select = document.getElementById("id_devoir");
          if (select && select.options.length > 1 && !select.value) {
            console.log(
              "👁️ MutationObserver a détecté le chargement des options",
            );
            const success = forceSelectDevoir(select, devoirId);
            if (success) {
              addVisualMessage();
              observer.disconnect();
              clearInterval(checkInterval);
            }
          }
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // Nettoyage après 10 secondes
        setTimeout(() => {
          clearInterval(checkInterval);
          observer.disconnect();
        }, 10000);
      })();
    </script>
