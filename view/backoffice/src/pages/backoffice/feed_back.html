    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toastContainer"

    <script>
      async function loadHtmlIncludes() {
        const includeTargets = document.querySelectorAll("[data-include-html]");
        for (const target of includeTargets) {
          const includePath = target.getAttribute("data-include-html");
          const response = await fetch(includePath);
          if (!response.ok) {
            target.outerHTML = "";
            continue;
          }
          let html = await response.text();
          html = html.replaceAll("@@webRoot/", "/eduleb/view/backoffice/src/");
          html = html.replaceAll("@@webRoot", "/eduleb/view/backoffice/src");
          target.outerHTML = html;
        }
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Failed to load " + src));
          document.body.appendChild(script);
        });
      }

      // Configuration
      const CONFIG = {
        controllerUrl: "/controller/devoirs_back.php",
      };

      function getControllerUrl() {
        const normalized = window.location.pathname.replaceAll("\\", "/");
        const marker = "/view/backoffice/src/pages/backoffice/";
        const markerIndex = normalized.indexOf(marker);
        if (markerIndex !== -1) {
          const appBase = normalized.slice(0, markerIndex);
          return `${appBase}/controller/devoirs_back.php`;
        }
        return "/controller/devoirs_back.php";
      }

      function escapeHtml(value) {
        if (!value) return "";
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function showToast(message, variant) {
        const toastContainer = document.getElementById("toastContainer");
        const color = variant === "danger" ? "danger" : "success";
        const toastId = `toast-${Date.now()}`;
        const toastMarkup = `
          <div id="${toastId}" class="toast align-items-center text-bg-${color} border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
              <div class="toast-body">${escapeHtml(message)}</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
          </div>
        `;
        toastContainer.insertAdjacentHTML("beforeend", toastMarkup);
        const toastElement = document.getElementById(toastId);
        const toast = bootstrap.Toast.getOrCreateInstance(toastElement, {
          delay: 2800,
        });
        toast.show();
        toastElement.addEventListener("hidden.bs.toast", () =>
          toastElement.remove(),
        );
      }

      async function fetchJson(url) {
        const response = await fetch(url, {
          headers: { "X-Requested-With": "XMLHttpRequest" },
        });
        const raw = await response.text();
        let payload = null;
        try {
          payload = JSON.parse(raw);
        } catch (error) {
          const jsonStart = raw.indexOf("{");
          const jsonEnd = raw.lastIndexOf("}");
          if (jsonStart !== -1 && jsonEnd !== -1 && jsonEnd > jsonStart) {
            try {
              payload = JSON.parse(raw.slice(jsonStart, jsonEnd + 1));
            } catch (innerError) {
              payload = null;
            }
          }
        }
        if (!payload) {
          throw new Error("Invalid JSON response from server.");
        }
        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || "Request failed.");
        }
        return payload;
      }

      function urgenceBadge(urgence) {
        const normalized = String(urgence || "").toLowerCase();
        if (normalized === "urgente") {
          return '<span class="urgence-urgente">🔴 Urgente</span>';
        }
        if (normalized === "moyenne") {
          return '<span class="urgence-moyenne">🟡 Moyenne</span>';
        }
        return '<span class="urgence-faible">🟢 Faible</span>';
      }

      function renderFeed(devoirs, corrections) {
        const container = document.getElementById("feedContainer");

        // Group corrections by devoir
        const correctionsByDevoir = {};
        corrections.forEach((corr) => {
          if (!correctionsByDevoir[corr.id_devoir]) {
            correctionsByDevoir[corr.id_devoir] = [];
          }
          correctionsByDevoir[corr.id_devoir].push(corr);
        });

        if (!devoirs || devoirs.length === 0) {
          container.innerHTML = `
            <div class="text-center py-5">
              <i class="ti ti-inbox" style="font-size: 3rem;"></i>
              <h4 class="mt-3">No devoirs found</h4>
              <p class="text-secondary">Click "Add Submission" to create your first devoir.</p>
            </div>
          `;
          return;
        }

        let html = "";
        devoirs.forEach((devoir) => {
          const devoirCorrections = correctionsByDevoir[devoir.id_devoir] || [];

          html += `
            <div class="devoir-card" data-devoir-id="${devoir.id_devoir}" data-devoir-title="${escapeHtml(devoir.titre).toLowerCase()}" data-devoir-keywords="${escapeHtml(devoir.mots_cles || "").toLowerCase()}">
              <div class="devoir-header">
                <div class="d-flex justify-content-between align-items-start flex-wrap">
                  <div>
                    <h4 class="mb-1">📘 ${escapeHtml(devoir.titre)}</h4>
                    <div class="d-flex gap-2 flex-wrap mt-2">
                      ${urgenceBadge(devoir.urgence)}
                      <span class="badge bg-secondary">${escapeHtml(devoir.niveau_difficulte)}</span>
                      <span class="text-secondary"><i class="ti ti-calendar"></i> ${escapeHtml(devoir.date_soumission)}</span>
                    </div>
                  </div>
                  <div class="d-flex gap-2">
                    <a href="submit_back.php?add_correction_for=${devoir.id_devoir}&title=${encodeURIComponent(devoir.titre)}" class="btn-add-correction">
                      <i class="ti ti-plus"></i> Ajouter correction
                    </a>
                    <button class="btn btn-sm btn-white edit-devoir" data-id="${devoir.id_devoir}">
                      <i class="ti ti-edit"></i> Edit
                    </button>
                    <button class="btn btn-sm btn-danger delete-devoir" data-id="${devoir.id_devoir}">
                      <i class="ti ti-trash"></i> Delete
                    </button>
                  </div>
                </div>
              </div>
              <div class="devoir-body">
                <p class="text-secondary">${escapeHtml(devoir.description)}</p>
                
                <div class="row">
                  <div class="col-md-4">
                    <div class="detail-chip">
                      <i class="ti ti-alert-triangle"></i>
                      <strong>Erreur:</strong> ${escapeHtml(devoir.type_erreur_predominant)}
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="detail-chip">
                      <i class="ti ti-clock"></i>
                      <strong>Temps:</strong> ${escapeHtml(devoir.temps_estime_resolution)} min
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="detail-chip">
                      <i class="ti ti-chart-bar"></i>
                      <strong>Progression:</strong> ${escapeHtml(devoir.progression_eleve)}%
                    </div>
                  </div>
                </div>
                
                ${
                  devoir.mots_cles
                    ? `
                  <div class="mt-2">
                    <strong>Mots clés:</strong>
                    <div>
                      ${devoir.mots_cles
                        .split(",")
                        .map(
                          (tag) =>
                            `<span class="tag">${escapeHtml(tag.trim())}</span>`,
                        )
                        .join("")}
                    </div>
                  </div>
                `
                    : ""
                }
                
                ${
                  devoir.fichier
                    ? `
                  <div class="mt-2">
                    <a href="#" class="text-primary">📎 ${escapeHtml(devoir.fichier)}</a>
                  </div>
                `
                    : ""
                }
              </div>
              
              <div class="corrections-container">
                ${
                  devoirCorrections.length === 0
                    ? `
                  <div class="text-secondary py-2">
                    <i class="ti ti-message-circle-off"></i> Aucune correction pour ce devoir
                  </div>
                `
                    : `
                  <div class="mb-2">
                    <strong><i class="ti ti-check-circle text-success"></i> ${devoirCorrections.length} correction(s)</strong>
                  </div>
                  ${devoirCorrections
                    .map(
                      (corr) => `
                    <div class="correction-card" data-correction-id="${corr.id_correction}" data-correction-comment="${escapeHtml(corr.commentaire || "").toLowerCase()}">
                      <div class="d-flex justify-content-between align-items-start flex-wrap">
                        <div>
                          <span class="note-badge">⭐ ${escapeHtml(corr.note_estimee)}/20</span>
                          <span class="badge bg-info ms-2">${escapeHtml(corr.type_feedback)}</span>
                          <span class="badge bg-secondary ms-2">${escapeHtml(corr.ton_feedback)}</span>
                          <span class="text-secondary ms-2"><i class="ti ti-calendar"></i> ${escapeHtml(corr.date_correction)}</span>
                        </div>
                        <div class="d-flex gap-2">
                          <button class="btn btn-sm btn-white edit-correction" data-id="${corr.id_correction}">
                            <i class="ti ti-edit"></i> Edit
                          </button>
                          <button class="btn btn-sm btn-danger delete-correction" data-id="${corr.id_correction}">
                            <i class="ti ti-trash"></i> Delete
                          </button>
                        </div>
                      </div>
                      <p class="mt-2 mb-1">${escapeHtml(corr.commentaire)}</p>
                      <div class="row small">
                        <div class="col-md-6">
                          <strong>Itérations:</strong> ${escapeHtml(corr.nombre_iterations)}
                        </div>
                        <div class="col-md-6">
                          <strong>Rapidité:</strong> ${escapeHtml(corr.rapidite_correction)} min
                        </div>
                      </div>
                      ${
                        corr.competences_evaluees
                          ? `
                        <div class="mt-2">
                          <strong>Compétences:</strong>
                          ${corr.competences_evaluees
                            .split(",")
                            .map(
                              (comp) =>
                                `<span class="tag">${escapeHtml(comp.trim())}</span>`,
                            )
                            .join("")}
                        </div>
                      `
                          : ""
                      }
                      ${
                        corr.suggestions_personnalisees
                          ? `
                        <div class="mt-2 p-2 bg-light rounded">
                          <strong>💡 Suggestions:</strong><br>
                          ${escapeHtml(corr.suggestions_personnalisees)}
                        </div>
                      `
                          : ""
                      }
                    </div>
                  `,
                    )
                    .join("")}
                `
                }
              </div>
            </div>
          `;
        });

        container.innerHTML = html;

        // Update stats
        document.getElementById("statTotalDevoirs").textContent =
          devoirs.length;
        document.getElementById("statTotalCorrections").textContent =
          corrections.length;
      }

      async function loadFeedData() {
        const controllerUrl = getControllerUrl();
        try {
          const [devoirPayload, correctionPayload] = await Promise.all([
            fetchJson(`${controllerUrl}?action=listdevoirs`),
            fetchJson(`${controllerUrl}?action=listcorrections`),
          ]);

          const devoirs = Array.isArray(devoirPayload.data)
            ? devoirPayload.data
            : [];
          const corrections = Array.isArray(correctionPayload.data)
            ? correctionPayload.data
            : [];

          renderFeed(devoirs, corrections);

          // Attach event handlers
          attachEventHandlers();
        } catch (error) {
          console.error("Error loading feed:", error);
          document.getElementById("feedContainer").innerHTML = `
            <div class="alert alert-danger">
              <i class="ti ti-alert-circle"></i> Error loading feed: ${escapeHtml(error.message)}
            </div>
          `;
        }
      }

      async function deleteItem(type, id) {
        const label = type === "devoir" ? "devoir" : "correction";
        if (!confirm(`Delete this ${label}?`)) return;

        const controllerUrl = getControllerUrl();
        const action = type === "devoir" ? "delete" : "deletecorrection";

        try {
          const response = await fetch(
            `${controllerUrl}?action=${action}&id=${encodeURIComponent(id)}`,
          );
          const raw = await response.text();

          showToast(`${label} deleted successfully`, "success");
          await loadFeedData();
        } catch (error) {
          showToast(error.message || `Unable to delete ${label}.`, "danger");
        }
      }

      function attachEventHandlers() {
        // Delete devoir
        document.querySelectorAll(".delete-devoir").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            const id = btn.dataset.id;
            deleteItem("devoir", id);
          });
        });

        // Delete correction
        document.querySelectorAll(".delete-correction").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            const id = btn.dataset.id;
            deleteItem("correction", id);
          });
        });

        // Edit devoir - redirect to submit_back.html with edit parameter
        document.querySelectorAll(".edit-devoir").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            const id = btn.dataset.id;
            window.location.href = `submit_back.php?edit=devoir&id=${id}`;
          });
        });

        // Edit correction
        document.querySelectorAll(".edit-correction").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            const id = btn.dataset.id;
            window.location.href = `submit_back.php?edit=correction&id=${id}`;
          });
        });

        // Search functionality
        const searchInput = document.getElementById("searchInput");
        const clearBtn = document.getElementById("clearFiltersBtn");

        if (searchInput) {
          searchInput.addEventListener("input", () => {
            const searchTerm = searchInput.value.toLowerCase();
            const cards = document.querySelectorAll(".devoir-card");

            cards.forEach((card) => {
              const devoirTitle = card.dataset.devoirTitle || "";
              const devoirKeywords = card.dataset.devoirKeywords || "";
              const corrections = card.querySelectorAll(".correction-card");

              let devoirMatch =
                searchTerm === "" ||
                devoirTitle.includes(searchTerm) ||
                devoirKeywords.includes(searchTerm);
              let correctionMatch = false;

              corrections.forEach((correction) => {
                const comment = correction.dataset.correctionComment || "";
                if (searchTerm !== "" && comment.includes(searchTerm)) {
                  correctionMatch = true;
                  correction.style.display = "block";
                } else if (searchTerm === "") {
                  correction.style.display = "block";
                } else {
                  correction.style.display = "none";
                }
              });

              if (devoirMatch || correctionMatch) {
                card.style.display = "block";
              } else if (searchTerm !== "") {
                card.style.display = "none";
              } else {
                card.style.display = "block";
              }
            });
          });
        }

        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            if (searchInput) {
              searchInput.value = "";
              searchInput.dispatchEvent(new Event("input"));
            }
          });
        }
      }

      async function bootFeedPage() {
        await loadHtmlIncludes();

        const scripts = [
          "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js",
          "https://cdn.jsdelivr.net/npm/simplebar@6.2.5/dist/simplebar.min.js",
          "../../assets/js/main.js",
          "../../assets/js/vendors/sidebarnav.js",
        ];

        for (const scriptPath of scripts) {
          try {
            await loadScript(scriptPath);
          } catch (error) {
            console.error(error);
          }
        }

        // Load feed data
        await loadFeedData();

        // Refresh button
        const refreshBtn = document.getElementById("refreshFeedBtn");
        if (refreshBtn) {
          refreshBtn.addEventListener("click", async () => {
            await loadFeedData();
            showToast("Feed refreshed", "success");
          });
        }
      }

      bootFeedPage();
    </script>
  </body>
