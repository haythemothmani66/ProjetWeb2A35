<!-- MODERN CHATBOT WIDGET -->
<div id="edumatch-chatbot" class="chatbot-container">
    <div id="chatbot-window" class="chatbot-window hidden">
        <div class="chatbot-header">
            <div class="chatbot-identity">
                <div class="chatbot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="chatbot-info">
                    <h5>Assistant EduMatch</h5>
                    <span class="status">En ligne (Grok-AI)</span>
                </div>
            </div>
            <button id="close-chatbot" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <div id="chatbot-messages" class="chatbot-messages">
            <div class="message bot">
                Bonjour ! Je suis l'assistant intelligent d'EduMatch. Comment puis-je vous aider aujourd'hui ?
            </div>
        </div>
        <div id="typing-indicator" class="typing-indicator hidden">
            <span></span><span></span><span></span>
        </div>
        <div class="chatbot-input">
            <input type="text" id="chat-input" placeholder="Posez votre question...">
            <button id="send-chat"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    <button id="chatbot-toggle" class="chatbot-toggle">
        <i class="fas fa-comments"></i>
        <span class="notification-badge">1</span>
    </button>
</div>

<style>
/* Chatbot Container */
.chatbot-container {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 9999;
    font-family: 'DM Sans', sans-serif;
}

/* Toggle Button */
.chatbot-toggle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff7f50 0%, #ff6347 100%);
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255, 127, 80, 0.4);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
}

.chatbot-toggle:hover {
    transform: scale(1.1) rotate(5deg);
}

.notification-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #4caf50;
    color: white;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 10px;
    border: 2px solid white;
}

/* Chat Window */
.chatbot-window {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 350px;
    height: 500px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: all 0.4s ease;
    transform-origin: bottom right;
}

.chatbot-window.hidden {
    transform: scale(0);
    opacity: 0;
    pointer-events: none;
}

/* Header */
.chatbot-header {
    background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chatbot-identity {
    display: flex;
    align-items: center;
    gap: 12px;
}

.chatbot-avatar {
    width: 40px;
    height: 40px;
    background: #ff7f50;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.chatbot-info h5 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
}

.chatbot-info .status {
    font-size: 11px;
    color: #4caf50;
}

.close-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 18px;
    transition: color 0.3s;
}

.close-btn:hover {
    color: white;
}

/* Messages Area */
.chatbot-messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.4;
}

.message.bot {
    align-self: flex-start;
    background: #f0f2f5;
    color: #1a1a1a;
    border-bottom-left-radius: 2px;
}

.message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #ff7f50 0%, #ff6347 100%);
    color: white;
    border-bottom-right-radius: 2px;
}

/* Typing Indicator */
.typing-indicator {
    padding: 10px 20px;
    display: flex;
    gap: 4px;
}

.typing-indicator span {
    width: 6px;
    height: 6px;
    background: #999;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
}

.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
}

.hidden { display: none !important; }

/* Input Area */
.chatbot-input {
    padding: 15px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
}

.chatbot-input input {
    flex: 1;
    border: 1px solid #ddd;
    padding: 10px 15px;
    border-radius: 25px;
    font-size: 14px;
    outline: none;
}

.chatbot-input button {
    width: 40px;
    height: 40px;
    background: #ff7f50;
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s;
}

.chatbot-input button:hover {
    background: #ff6347;
}

@media (max-width: 480px) {
    .chatbot-window {
        width: 300px;
        right: -10px;
        height: 450px;
    }
}
</style>

<script>
(function() {
    const toggleBtn = document.getElementById('chatbot-toggle');
    const closeBtn = document.getElementById('close-chatbot');
    const chatWindow = document.getElementById('chatbot-window');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-chat');
    const messagesContainer = document.getElementById('chatbot-messages');
    const typingIndicator = document.getElementById('typing-indicator');
    const badge = toggleBtn ? toggleBtn.querySelector('.notification-badge') : null;

    if (!toggleBtn || !chatWindow) return;

    // Toggle Window
    toggleBtn.addEventListener('click', () => {
        chatWindow.classList.toggle('hidden');
        if (badge) badge.style.display = 'none';
    });

    closeBtn.addEventListener('click', () => {
        chatWindow.classList.add('hidden');
    });

    // Send Message
    async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;

        // Add user message
        addMessage(message, 'user');
        chatInput.value = '';

        // Show typing
        typingIndicator.classList.remove('hidden');
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
            const response = await fetch('/gestion_users/api/groq_chatbot.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            
            // Hide typing
            typingIndicator.classList.add('hidden');

            if (data.success) {
                addMessage(data.reply, 'bot');
            } else {
                addMessage("Désolé, j'ai rencontré une erreur : " + (data.error || "Inconnue"), 'bot');
            }
        } catch (error) {
            if (typingIndicator) typingIndicator.classList.add('hidden');
            addMessage("Erreur de connexion au serveur.", 'bot');
        }
    }

    function addMessage(text, side) {
        const div = document.createElement('div');
        div.className = `message ${side}`;
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    if (sendBtn) sendBtn.addEventListener('click', sendMessage);
    if (chatInput) {
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    }
})();
</script>
